name: Site and dashboard checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'browser=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(app\.py|static/|templates/|tests/browser/|playwright\.config\.cjs|package(-lock)?\.json|\.github/workflows/)'; then
            echo 'browser=true' >> "$GITHUB_OUTPUT"
          else
            echo 'browser=false' >> "$GITHUB_OUTPUT"
          fi
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install flask pyyaml pytest lancedb pandas
      - run: python -m pytest tests/ -q
      - run: python tools/check_html.py
      - run: npm ci
      - run: npm run test:unit
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Browser tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ui
            shard: 1/1
            label: ui
          - suite: scenes
            shard: 1/2
            label: scenes 1/2
          - suite: scenes
            shard: 2/2
            label: scenes 2/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install flask pyyaml lancedb pandas
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local dashboard
        run: |
          python app.py > /tmp/sato-site.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sato-site.log
          exit 1
      - name: Run Playwright suite
        run: npm run test:browser -- --project=${{ matrix.suite }} --shard=${{ matrix.shard }} --fully-parallel --reporter=list
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: browser-test-results-${{ strategy.job-index }}
          path: |
            test-results/
            /tmp/sato-site.log
