<!doctype html><meta charset="utf-8"><title>Sato Mimic — preset review</title>
<style>body{margin:0;width:1280px;background:#14222c;color:#d7edf5;font:15px system-ui}h1{font-size:22px;margin:18px 22px 4px}p{margin:0 22px 16px;color:#94b8c8}.gallery{position:relative;width:1280px;height:1280px}canvas{position:absolute;inset:0}.labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,320px);grid-template-rows:repeat(4,320px);pointer-events:none}.label{padding:12px 15px;border:1px solid #b1e9fb19}.label small{display:block;color:#85a3b2;font-size:12px;margin-top:3px}</style>
<h1>Sato Agent · biblioteca de imitações</h1><p>16 coreografias da aplicação · animais / veículos / objetos / natureza</p><div class="gallery"><div class="labels"></div></div>
<script type="module">
import * as T from '/static/vendor/three.module.min.js';
import {createSceneArt} from '/static/js/scene-art.js';
import {createCompanionBot,poseCompanion} from '/static/js/companion-bot.js';
import {createMimicPerformer} from '/static/js/mimic-performer.js';
import {MIMIC_PRESETS,MIMIC_LIBRARY} from '/static/js/mimic-contract.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1280,1280);renderer.setClearColor('#14222c');renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.querySelector('.gallery').prepend(renderer.domElement);
const entries=Object.entries(MIMIC_PRESETS).map(([key,preset],index)=>{
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,1,.1,20);camera.position.set(0,1.35,4.2);camera.lookAt(0,1.35,0);
 scene.add(new T.HemisphereLight('#f1faff','#496070',2.2));const light=new T.DirectionalLight('#ffffff',2.5);light.position.set(-3,5,4);scene.add(light);
 const rig=createCompanionBot(createSceneArt(),{reduced:()=>true}),performer=createMimicPerformer(rig);scene.add(rig.root);
 const plan=structuredClone(preset);plan.duration=12;plan.cycles=3;performer.start(plan,0);
 const label=document.createElement('div');label.className='label';label.textContent=preset.label;const small=document.createElement('small');small.textContent=MIMIC_LIBRARY[key].category+' · '+key;label.append(small);document.querySelector('.labels').append(label);
 return {key,scene,camera,rig,performer,index};
});
window.renderMimicPhase=phase=>{
 renderer.setScissorTest(true);
 for(const {scene,camera,rig,performer,index}of entries){
  const body=performer.update(phase?6:4);
  for(let i=0;i<120;i++)poseCompanion(rig,0,1/60,{reduced:true});
  rig.root.position.y=body.lift;rig.root.rotation.set(body.pitch,body.yaw,body.roll);
  const x=index%4*320,y=(3-Math.floor(index/4))*320;renderer.setViewport(x,y,320,320);renderer.setScissor(x,y,320,320);renderer.render(scene,camera);
 }
};
renderMimicPhase(0);window.mimicGallery=entries.map(({key,rig})=>({key,arms:rig.arms.length,led:rig.visor.material.uniforms.uDrawing.value}));
</script>
