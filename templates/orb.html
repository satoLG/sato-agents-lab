<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030a10">
  <meta name="description" content="Uma ilha em um oceano esférico transparente, flutuando no espaço. Explore orb em 3D.">
  <title>orb · Um mundo à deriva</title>
  <link rel="icon" href="{{ url_for('static', filename='sato-logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('lab_asset', version=lab_asset_version, filename='css/orb.css') }}">
</head>
<body data-page="orb">
  <main id="orb-experience" aria-label="orb, um mundo à deriva">
    <div id="orb-scene" tabindex="0" role="region" aria-label="Mundo 3D. Arraste para orbitar; use a roda ou dois dedos para zoom. No teclado: setas para girar, mais e menos para zoom, zero para restaurar a vista e espaço para pausar ou retomar."></div>
    <div id="orb-blur" aria-hidden="true"></div>
    <div id="orb-loading" aria-label="Carregando orb">
      <button id="orb-start" type="button" aria-label="Carregando orb" disabled>
        <span class="water-fill" aria-hidden="true">
          {% for layer in ['wave-back-2','wave-back-1','wave-front'] %}
          <span class="wave-wrapper {{ layer }}"><svg class="wave-svg" viewBox="0 0 800 20" preserveAspectRatio="none"><path d="M0 8 Q 10 3, 20 8{% for x in range(40,801,20) %} T {{ x }} 8{% endfor %} V20 H0 Z"/></svg></span>
          {% endfor %}
        </span>
        <span id="orb-loading-percent" class="loading-percent" aria-hidden="true">0</span>
        <svg class="start-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg>
      </button>
      <div id="orb-progress" class="sr-only" role="progressbar" aria-label="Carregamento da cena" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
    <div id="orb-error" role="alert" hidden><h1>O mundo ainda não apareceu.</h1><p id="orb-error-detail">A visualização precisa de WebGL 2. Tente outro navegador com aceleração gráfica ativada.</p><button id="orb-retry" type="button">Tentar novamente</button><a href="/">Voltar ao início</a></div>
    <noscript><div class="no-script">Ative o JavaScript para explorar este mundo em 3D.</div></noscript>
    <p id="orb-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="{{ url_for('lab_asset', version=lab_asset_version, filename='js/orb.js') }}"></script>
</body>
</html>
