<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Revisor">
  <style>
    .bob { animation: bob 3.4s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .pupil { animation: look 4.2s ease-in-out infinite; }
    .lens { animation: sweep 4.2s ease-in-out infinite; }
    .check { stroke-dasharray: 30; animation: check 4.2s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes look { 0%, 100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }
    @keyframes sweep { 0%, 100% { transform: translate(-6px, 2px); } 50% { transform: translate(6px, -2px); } }
    @keyframes check { 0%, 55% { stroke-dashoffset: 30; } 75%, 100% { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .bob, .eye, .pupil, .lens, .check { animation: none; stroke-dashoffset: 0; } }
  </style>
  <defs><clipPath id="round"><circle cx="64" cy="64" r="64"/></clipPath></defs>
  <g clip-path="url(#round)">
  <circle cx="64" cy="64" r="64" fill="#0f3a2a"/>
  <circle cx="64" cy="64" r="58" fill="#165239"/>
  <g>
    <circle cx="101" cy="28" r="13" fill="#fff"/>
    <path class="check" d="M94 28l5 5 9-10" fill="none" stroke="#22a86b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="bob">
    <!-- corpo: camisa verde com gola -->
    <path d="M30 128c0-24 15-38 34-38s34 14 34 38z" fill="#3ecf8e"/>
    <path d="M54 91l10 9 10-9" fill="#e8f7ef"/>
    <!-- cabeça -->
    <circle cx="64" cy="62" r="25" fill="#f0c29b"/>
    <path d="M39 61c-1-17 10-28 25-28s27 10 25 27c-2-8-6-13-11-16-7 5-20 6-30 3-4 3-8 8-9 14z" fill="#b4b8bd"/>
    <!-- sobrancelhas sérias -->
    <path d="M50 55l9 2M78 55l-9 2" stroke="#7d8287" stroke-width="2.4" stroke-linecap="round"/>
    <g class="eye"><g class="pupil">
      <ellipse cx="55" cy="63" rx="3" ry="3.6" fill="#22201f"/>
    </g></g>
    <g class="eye"><g class="pupil">
      <ellipse cx="73" cy="63" rx="3" ry="3.6" fill="#22201f"/>
    </g></g>
    <path d="M59 75h10" stroke="#7a4a35" stroke-width="2.2" stroke-linecap="round"/>
    <!-- lupa -->
    <g class="lens">
      <path d="M78 116l12 12" stroke="#6b4a2e" stroke-width="7" stroke-linecap="round"/>
      <circle cx="68" cy="106" r="14" fill="#cfefff" fill-opacity=".45" stroke="#d9dde2" stroke-width="4.5"/>
      <path d="M61 100a8 8 0 0 1 6-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
  </g>
</svg>
