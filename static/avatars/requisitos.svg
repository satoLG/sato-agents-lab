<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Requisitos">
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
    .pen { transform-box: fill-box; transform-origin: 10% 90%; animation: write 1.1s ease-in-out infinite; }
    .bubble { transform-box: fill-box; transform-origin: center; animation: think 3.2s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes write { 0%, 100% { transform: rotate(0deg) translateX(0); } 50% { transform: rotate(-12deg) translateX(3px); } }
    @keyframes think { 0%, 100% { transform: scale(.9); opacity: .75; } 50% { transform: scale(1.06); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bob, .eye, .pen, .bubble { animation: none; } }
  </style>
  <defs><clipPath id="round"><circle cx="64" cy="64" r="64"/></clipPath></defs>
  <g clip-path="url(#round)">
  <circle cx="64" cy="64" r="64" fill="#16324d"/>
  <circle cx="64" cy="64" r="58" fill="#1d4569"/>
  <g class="bubble">
    <circle cx="101" cy="28" r="13" fill="#fff"/>
    <circle cx="88" cy="44" r="3.2" fill="#fff"/>
    <path d="M97 24a4.5 4.5 0 1 1 6 4.2c-1.4.6-2 1.4-2 2.8" fill="none" stroke="#4aa8ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="101" cy="35" r="1.8" fill="#4aa8ff"/>
  </g>
  <g class="bob">
    <!-- corpo: moletom azul -->
    <path d="M30 128c0-24 15-38 34-38s34 14 34 38z" fill="#4aa8ff"/>
    <path d="M52 92l12 10 12-10" fill="none" stroke="#2b7fd0" stroke-width="3" stroke-linecap="round"/>
    <!-- cabeça -->
    <circle cx="64" cy="62" r="25" fill="#f6c9a5"/>
    <path d="M39 60c0-17 11-27 25-27s26 9 26 25c-6-7-15-10-26-10s-18 4-25 12z" fill="#5a3a24"/>
    <!-- boina -->
    <path d="M38 50c3-14 16-21 30-19 12 2 20 9 21 16-15-6-34-6-51 3z" fill="#2b7fd0"/>
    <circle cx="66" cy="30" r="3" fill="#2b7fd0"/>
    <ellipse class="eye" cx="55" cy="64" rx="3.2" ry="4" fill="#2a1d14"/>
    <ellipse class="eye" cx="73" cy="64" rx="3.2" ry="4" fill="#2a1d14"/>
    <circle cx="50" cy="72" r="3.5" fill="#f19c8a" opacity=".55"/>
    <circle cx="78" cy="72" r="3.5" fill="#f19c8a" opacity=".55"/>
    <path d="M59 74q5 4 10 0" fill="none" stroke="#7a4a35" stroke-width="2.2" stroke-linecap="round"/>
    <!-- prancheta -->
    <rect x="44" y="95" width="30" height="33" rx="3" fill="#e9eef5" transform="rotate(-8 59 111)"/>
    <rect x="53" y="92" width="12" height="6" rx="2" fill="#8a96a8" transform="rotate(-8 59 111)"/>
    <g fill="none" stroke="#4aa8ff" stroke-width="2.4" stroke-linecap="round" transform="rotate(-8 59 111)">
      <path d="M50 105l2.5 2.5 4-4.5"/><path d="M60 105h9"/>
      <path d="M50 114l2.5 2.5 4-4.5"/><path d="M60 114h8"/>
    </g>
    <!-- lápis -->
    <g class="pen">
      <rect x="74" y="98" width="5" height="22" rx="1.5" fill="#ffcf4a" transform="rotate(35 76 109)"/>
      <path d="M68.5 117l3.4 2.3-4.6 2.3z" fill="#3a2a1a"/>
    </g>
  </g>
  </g>
</svg>
