<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Programador">
  <style>
    .bob { animation: bob 1.6s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .hand-l { animation: tap .32s ease-in-out infinite alternate; }
    .hand-r { animation: tap .32s ease-in-out .16s infinite alternate; }
    .code { animation: float 2.8s ease-in-out infinite; }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }
    @keyframes tap { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    @keyframes float { 0% { transform: translateY(4px); opacity: 0; } 25%, 70% { opacity: 1; } 100% { transform: translateY(-8px); opacity: 0; } }
    @keyframes cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bob, .eye, .hand-l, .hand-r, .code, .cursor { animation: none; } }
  </style>
  <defs><clipPath id="round"><circle cx="64" cy="64" r="64"/></clipPath></defs>
  <g clip-path="url(#round)">
  <circle cx="64" cy="64" r="64" fill="#4a2410"/>
  <circle cx="64" cy="64" r="58" fill="#6b3417"/>
  <g class="code" fill="none" stroke="#ffb27a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 22l-6 6 6 6"/><path d="M104 22l6 6-6 6"/><path d="M99 19l-4 18"/>
  </g>
  <g class="bob">
    <!-- corpo: camiseta laranja -->
    <path d="M30 128c0-24 15-38 34-38s34 14 34 38z" fill="#ff8a3d"/>
    <!-- cabeça -->
    <circle cx="64" cy="60" r="25" fill="#c98b62"/>
    <path d="M40 55c2-15 12-23 24-23 13 0 24 8 24 22-3-3-6-6-10-7l-2 5-4-6c-6 2-12 2-18 0l-3 5-3-5c-3 2-6 5-8 9z" fill="#1d1612"/>
    <!-- fone -->
    <path d="M38 62a26 26 0 0 1 52 0" fill="none" stroke="#2e2e38" stroke-width="5"/>
    <rect x="33" y="58" width="9" height="15" rx="4" fill="#2e2e38"/>
    <rect x="86" y="58" width="9" height="15" rx="4" fill="#2e2e38"/>
    <ellipse class="eye" cx="55" cy="62" rx="3" ry="3.8" fill="#1d1612"/>
    <ellipse class="eye" cx="73" cy="62" rx="3" ry="3.8" fill="#1d1612"/>
    <path d="M60 72q4 2.5 8 0" fill="none" stroke="#5e3420" stroke-width="2.2" stroke-linecap="round"/>
    <!-- notebook -->
    <path d="M34 104h60l-6 22H40z" fill="#3a3d4a"/>
    <rect x="40" y="88" width="48" height="18" rx="2.5" fill="#23252e"/>
    <g stroke-linecap="round" stroke-width="2">
      <path d="M45 94h12" stroke="#7fd1ff"/><path d="M60 94h8" stroke="#ffb27a"/>
      <path d="M49 99h16" stroke="#9be39b"/>
      <path class="cursor" d="M68 97v5" stroke="#fff"/>
    </g>
    <circle cx="64" cy="115" r="2.5" fill="#ff8a3d"/>
    <!-- mãos digitando -->
    <ellipse class="hand-l" cx="50" cy="110" rx="6" ry="4" fill="#c98b62"/>
    <ellipse class="hand-r" cx="78" cy="110" rx="6" ry="4" fill="#c98b62"/>
  </g>
  </g>
</svg>
