name: Dashboard and laboratory checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install flask pyyaml pytest lancedb pandas
      - run: python -m pytest tests/ -q
      - run: python tools/check_html.py
      - run: npm ci
      - run: npm run test:navigation
      - run: npm run test:avatar
      - run: npm run test:rigs
      - run: npm run test:controls
      - run: node --test tests/lab-monitors.test.mjs tests/lab-grid.test.mjs tests/scene-nature.test.mjs tests/orb-game.test.mjs tests/orb-power.test.mjs tests/orb-combat.test.mjs
  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install flask pyyaml lancedb pandas
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local dashboard
        run: |
          python app.py > /tmp/sato-lab.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/lab > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sato-lab.log
          exit 1
      - name: Run Playwright shard
        run: npm run test:browser -- --shard=${{ matrix.shard }}/4 --fully-parallel --reporter=list
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            test-results/
            /tmp/sato-lab.log
